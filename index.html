<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueNexus</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>

<!-- AUTHENTIFICATION -->
<div id="auth-screen" class="screen active">
  <div class="auth-box">
    <h1 class="logo">Blue<span>Nexus</span></h1>
    <p class="tagline">Communautés · Musique · Découverte</p>
    <input id="auth-email" type="email" placeholder="Email" />
    <input id="auth-pass" type="password" placeholder="Mot de passe" />
    <input id="auth-name" type="text" placeholder="Nom d'utilisateur" />
    <button id="btn-login" class="btn-primary">Se connecter</button>
    <button id="btn-signup" class="btn-secondary">Créer un compte</button>
    <button id="btn-forgot-password" class="btn-secondary" style="border:none;color:var(--blue-light);font-size:0.8rem;">Mot de passe oublié ?</button>
    <p id="auth-error" class="error"></p>
  </div>
</div>

<!-- APPLICATION -->
<div id="app-screen" class="screen">
  
  <header class="top-bar" id="main-header">
    <h2 id="page-title">Accueil</h2>
    <button id="btn-settings-top" class="icon-btn">⚙️</button>
  </header>

  <main id="main-content">
    <!-- ACCUEIL -->
    <section id="view-home" class="view active">
      <div class="action-row" style="justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.1rem;">Fil d'actualité</h3>
        <button id="btn-go-communities" class="btn-primary small">🌐 Communautés</button>
      </div>
      <div id="global-post-container" style="display: none; background: var(--bg-2); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1rem;">
        <textarea id="global-post-content" placeholder="Publier une annonce..." style="margin-bottom: 0.5rem;"></textarea>
        <button id="btn-global-publish" class="btn-primary small">Publier</button>
      </div>
      <div id="global-feed-list" class="media-list"></div>
    </section>

    <!-- COMMUNAUTÉS -->
    <section id="view-communities" class="view">
      <button id="btn-back-home-comm" class="btn-secondary small" style="margin-bottom: 1rem;">← Retour</button>
      <div class="action-row">
        <button id="btn-new-community" class="btn-primary small">+ Créer une communauté</button>
      </div>
      <div id="communities-list" class="card-grid"></div>
    </section>

    <!-- VUE COMMUNAUTÉ (CHAT DE GROUPE) -->
    <section id="view-community" class="view">
      <div class="comm-header-fixed">
        <button id="btn-back-from-comm" class="btn-secondary small" style="padding: 4px 8px;">←</button>
        <div style="flex: 1; margin-left: 10px;">
          <h2 id="comm-title-display" style="font-size: 1rem; margin: 0;">Nom</h2>
          <p id="members-count" class="muted" style="font-size: 0.75rem; margin: 0;">0 membres</p>
        </div>
        <button id="btn-join-community" class="btn-primary small">Rejoindre</button>
      </div>
      <div id="posts-list" class="media-list" style="padding: 1rem; padding-bottom: 80px;"></div>
      <div id="post-form-container" class="chat-input-bar hidden">
        <div style="flex: 1; position: relative;">
          <textarea id="post-content" placeholder="Écrivez un message..." rows="1" style="padding-right: 40px; border-radius: 20px;"></textarea>
          <input type="file" id="post-file" accept="image/*,video/*,audio/*" style="display: none;">
          <button id="btn-attach-file" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer;">📎</button>
        </div>
        <button id="btn-publish-post" class="btn-primary" style="padding: 10px 15px; border-radius: 50%;">➤</button>
      </div>
    </section>

    <!-- MESSAGERIE PRIVÉE (LISTE) -->
    <section id="view-messages" class="view">
      <h3>Messages Privés</h3>
      <p class="muted" style="margin-bottom: 1rem;">Sélectionnez un membre pour discuter.</p>
      <div id="users-list" class="card-grid"></div>
    </section>

    <!-- MESSAGERIE PRIVÉE (CHAT ACTIF) -->
    <section id="view-chat" class="view">
      <div class="comm-header-fixed" style="background: var(--bg-2);">
        <button id="btn-back-from-chat" class="btn-secondary small" style="padding: 4px 8px;">←</button>
        <h2 id="chat-with-name" style="font-size: 1rem; margin-left: 10px;">Nom</h2>
      </div>
      <div id="chat-messages" class="media-list" style="padding: 1rem; padding-bottom: 80px; min-height: calc(100vh - 120px);"></div>
      <div class="chat-input-bar">
        <div style="flex: 1;">
          <textarea id="chat-input" placeholder="Votre message..." rows="1" style="border-radius: 20px;"></textarea>
        </div>
        <button id="btn-send-chat" class="btn-primary" style="padding: 10px 15px; border-radius: 50%; font-size: 1rem; flex-shrink: 0;">➤</button>
      </div>
    </section>

    <!-- MUSIQUE & VIDÉO -->
    <section id="view-music" class="view"><h3>Bibliothèque Musicale</h3><div id="music-list" class="media-list" style="margin-top: 1rem;"></div></section>
    <section id="view-video" class="view"><h3>Découvertes Vidéo</h3><div id="video-list" class="media-list" style="margin-top: 1rem;"></div></section>
    
    <!-- RECHERCHE -->
    <section id="view-search" class="view">
      <input id="search-input" type="text" placeholder="Rechercher un utilisateur..." style="margin-bottom: 1rem;" />
      <div id="search-results" class="card-grid"></div>
    </section>
    
    <!-- PROFIL -->
    <section id="view-profile" class="view">
      <div class="fb-profile">
        <div class="fb-banner"></div>
        <div class="fb-avatar-container">
          <div class="fb-avatar" id="profile-avatar"></div>
          <div><h2 id="profile-name">—</h2><p id="profile-bio" class="muted"></p></div>
        </div>
        <div id="profile-badges" style="padding: 0 1rem; display: flex; gap: 5px;"></div>
        <div class="fb-pinned"><h3>Publications épinglées</h3><div id="profile-pinned" class="media-list"></div></div>
      </div>
    </section>
    
    <!-- PARAMÈTRES -->
    <section id="view-settings" class="view">
      <h3>Paramètres</h3>
      <button id="btn-edit-profile-view" class="btn-primary" style="margin-top: 1rem;">Modifier mon profil</button>
      <button id="btn-logout" class="btn-secondary" style="margin-top: 1rem; color: #ff6b6b; border-color: #ff6b6b;">Se déconnecter</button>
    </section>

  </main>

  <!-- BARRE DE NAVIGATION EN BAS -->
  <nav class="bottom-nav" id="main-nav">
    <button data-view="home" class="nav-btn active">🏠<span>Accueil</span></button>
    <button data-view="messages" class="nav-btn">✉️<span>Messages</span></button>
    <button data-view="music" class="nav-btn">🎵<span>Musique</span></button>
    <button data-view="video" class="nav-btn">🎬<span>Vidéo</span></button>
    <button data-view="search" class="nav-btn">🔍<span>Recherche</span></button>
    <button data-view="profile" class="nav-btn">👤<span>Profil</span></button>
  </nav>
</div>

<!-- MODALES -->
<div id="modal-community" class="modal hidden">
  <div class="modal-content">
    <h3>Créer une communauté</h3>
    <input id="comm-name" placeholder="Nom" />
    <textarea id="comm-desc" placeholder="Description"></textarea>
    <select id="comm-type"><option value="chat">💬 Groupe Privé</option><option value="announcement">📢 Chaîne Publique</option></select>
    <button id="comm-save" class="btn-primary">Créer</button>
    <button id="comm-cancel" class="btn-secondary">Annuler</button>
  </div>
</div>

<div id="modal-profile" class="modal hidden">
  <div class="modal-content">
    <h3>Modifier mon profil</h3>
    <label class="muted">Photo</label>
    <input type="file" id="edit-avatar" accept="image/*">
    <label class="muted">Bio</label>
    <textarea id="edit-bio"></textarea>
    <button id="btn-save-profile" class="btn-primary">Enregistrer</button>
    <button id="btn-cancel-profile" class="btn-secondary">Annuler</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
